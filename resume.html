<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume — Jackson Marshall</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background-color: #0a0e2e;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .resume-image-container {
            width: 100%;
            max-width: 900px;
            margin: 2rem auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .resume-image {
            width: 100%;
            display: block;
        }
        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
            padding: 0.6rem 1.2rem;
            background: rgba(184, 197, 255, 0.1);
            border: 1px solid rgba(184, 197, 255, 0.25);
            color: #b8c5ff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            border-radius: 2px;
            backdrop-filter: blur(5px);
        }
        .back-btn:hover {
            background: rgba(184, 197, 255, 0.2);
            border-color: rgba(184, 197, 255, 0.4);
            color: #e8ecff;
        }
        @media (max-width: 768px) {
            .back-btn {
                top: 1rem;
                left: 1rem;
                font-size: 0.8rem;
            }
            .resume-image-container {
                margin: 4rem 1rem 2rem;
                width: calc(100% - 2rem);
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back</a>
    
    <div class="resume-image-container">
        <img src="assets/docs/resume-1.png" alt="Jackson Marshall Resume" class="resume-image">
    </div>

    <!-- Background Video (kept for consistency with site theme, but at low opacity) -->
    <video class="bg-video" autoplay muted playsinline loop style="opacity: 0.15; z-index: -1;">
        <source src="assets/videos/orbis_blueprint.webm" type="video/webm">
        <source src="assets/videos/orbis_blueprint.mp4" type="video/mp4">
    </video>
</body>
</html>
