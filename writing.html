<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing — Jackson Marshall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (!document.querySelector(".ascii-border-left")) {
                const leftBorder = document.createElement("div");
                leftBorder.className = "ascii-border-left";
                const rightBorder = document.createElement("div");
                rightBorder.className = "ascii-border-right";
                document.body.insertBefore(leftBorder, document.body.firstChild);
                document.body.insertBefore(rightBorder, document.body.firstChild);
            }
        });
    </script>
</head>
<body>
    <!-- Background Video -->
    <video class="bg-video" autoplay muted playsinline loop>
        <source src="assets/videos/orbis_blueprint.webm" type="video/webm">
        <source src="assets/videos/orbis_blueprint.mp4" type="video/mp4">
    </video>

    <!-- Image Banners -->
    <div class="image-banner image-banner-left"></div>
    <div class="image-banner image-banner-right"></div>

    <!-- Content Container -->
    <div class="content-wrapper">
        <!-- Navigation -->
        <nav class="page-nav">
            <a href="index.html" class="nav-link">← Back</a>
            <a href="admin.html" class="nav-link" style="margin-left: auto; opacity: 0.5; font-size: 0.75rem;">✎</a>
        </nav>

        <!-- Writing Header -->
        <section class="page-header">
            <h1 class="page-title">Writing</h1>
            <p class="page-subtitle">Essays and reflections on engineering, systems, and design.</p>
        </section>

        <!-- Articles List -->
        <section class="writing-container">
            <div class="articles-list" id="articlesList">
                <!-- Articles will be injected by writing.js -->
                <div class="loading-placeholder">[LOADING_WRITING_DATA...]</div>
            </div>
        </section>
    </div>

    <!-- Reading View Modal -->
    <div class="reading-view" id="readingView">
        <div class="reading-close" id="readingClose">×</div>
        <article class="reading-content">
            <h1 class="reading-title" id="readingTitle"></h1>
            <p class="reading-date" id="readingDate"></p>
            <div class="reading-body" id="readingBody"></div>
        </article>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/darkroomengineering/lenis@latest/bundled/lenis.js"></script>
    <script src="js/data.js"></script>
    <script src="js/writing.js"></script>
</body>
</html>
